groups:
  - name: consultation-slo-alerts
    rules:
      - alert: HighErrorBurnRate_Fast
        expr: |
          sum(rate(consultation_requests_total{outcome="error"}[1h])) 
          / 
          sum(rate(consultation_requests_total[1h])) 
          > (14.4 * 0.005)
        for: 5m
        labels:
          severity: critical
          team: telemedicina
        annotations:
          summary: "Fast burn rate on consultation API"
          runbook_url: "https://github.com/BondrewdXD/telemed-ia-docs/blob/main/11-week/workshop/07-runbook.md"

      - alert: HighErrorBurnRate_Slow
        expr: |
          sum(rate(consultation_requests_total{outcome="error"}[6h])) 
          / 
          sum(rate(consultation_requests_total[6h])) 
          > (6 * 0.005)
        for: 30m
        labels:
          severity: warning
          team: telemedicina
        annotations:
          summary: "Slow burn rate on consultation API"
          runbook_url: "https://github.com/BondrewdXD/telemed-ia-docs/blob/main/11-week/workshop/07-runbook.md"